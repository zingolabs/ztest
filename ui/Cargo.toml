[package]
name = "ztest_ui"
description = "Terminal rendering and the pinned run console for `ztest`; internal, no semver guarantee."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ztest.workspace = true

async-trait = "0.1"
avt = "0.18"
bytesize = "2.1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
owo-colors = "4.3.0"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
supports-color = "3.0.2"
supports-unicode = "3.0.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
kube = { version = "0.99", default-features = false }
console = "0.16.4"
libc = "0.2"
terminal_size = "0.4"
