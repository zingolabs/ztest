#
# The manifest is the artifact's record of itself. The filename mirrors
# (backend, version, network, height) as a convention for humans; every
# consumer reads those from the fields below, so a rename cannot change
# what the archive claims to be. Every field exists to make a stale
# artifact fail loudly rather than mysteriously.

# ── Identity ─────────────────────────────────────────────────────────────
# Read by `archive!` at compile time and baked into the typed handle.
# `network` decides the network a restored validator boots on, so a testnet
# archive cannot be started as regtest.
backend = "zebra"
version = "6.2.3"
network = "testnet"

# ── Provenance ───────────────────────────────────────────────────────────
produced_by = "zfnd/zebra:6.2.3"
# Zebra's own `state.debug_stop_at_height`: commits to the height, closes
# RocksDB cleanly, exits 0. Quiescent by construction, not by a well-timed
# SIGTERM.
stop_method = "state.debug_stop_at_height"

# ── Pin ──────────────────────────────────────────────────────────────────
# Taken from Zebra's shutdown record, not from the syncer's trailing
# `state_tip` lines — those keep logging for a moment afterwards as
# in-flight tasks unwind, and report HEIGHT-1.
