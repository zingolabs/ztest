tip_hash   = "0000000002089249f062233ea573e429743201d72e1e344d9c4663c2457c1b7e"

# ── Rot detection ────────────────────────────────────────────────────────
# Zebra's on-disk state format. When Zebra bumps this, the archive is stale:
# a reader either upgrades the db in place — so it stops being the artifact
# the name promises — or fails to open it.
db_format = 28

# ── Bytes ────────────────────────────────────────────────────────────────
sha256             = "1106bc19e27da2484591c334eedca4ba8a9fec6ee800c4936fc63f5926d7b01d"
size_bytes         = 14016194520
uncompressed_bytes = 22462476288

# Archive contents: `state/` only, rooted so it extracts to
# `<mount>/state/v28/mainnet/...`. Owned by uid/gid 10001, which
# is what the zfnd/zebra image runs as, so no chown is needed on restore.
# `network/` (stale peer cache) and `non_finalized_state/` (must never carry
# blocks above the pin) are excluded.
contents = "state/"


