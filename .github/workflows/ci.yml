name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # protoc = xtask only (bindings are checked in, so the crates build without it)
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # toolchain pinned by rust-toolchain.toml; action also caches ~/.cargo + target
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # bindings are checked in; regen must be a no-op against proto/*.proto
      - run: cargo xtask regen-proto
      - run: git diff --exit-code src/proto/generated.rs
      - run: cargo nextest run --workspace
